<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天災降臨</title>
<style>
:root{
  --bg:#1d2a44; --panel:#ffffff; --ink:#24324d; --muted:#6b7895;
  --accent:#ff7a45; --accent2:#ffc53d; --good:#52c41a; --bad:#ff4d4f; --purple:#8e44ad;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#24324d;color:#fff;flex:0 0 auto}
#score{font-size:20px;font-weight:800;min-width:120px}
#score small{font-size:12px;font-weight:600;opacity:.75;margin-right:4px}
#info{flex:1;text-align:center;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px}
#info.warn{color:#ff7875;animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.12)}}
.popbar{width:min(180px,32vw);height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.popbar i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .2s}
.hbtn{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:38px;height:38px;border-radius:10px;cursor:pointer}
.hbtn:active{transform:scale(.92)}
#stage{position:relative;flex:1 1 auto;min-height:0;background:#6fb24e}
#c{position:absolute;inset:0;display:block;touch-action:none;cursor:crosshair}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(36,50,77,.92);color:#fff;
  padding:8px 16px;border-radius:999px;font-weight:700;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#bar{display:flex;gap:8px;padding:8px;background:#24324d;flex:0 0 auto;padding-bottom:max(8px,env(safe-area-inset-bottom))}
.dis{position:relative;flex:1;border:3px solid transparent;border-radius:14px;background:#33456b;color:#fff;
  padding:6px 4px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1px;font-family:inherit}
.dis .ico{font-size:26px;line-height:1.1}
.dis .nm{font-weight:800;font-size:15px}
.dis .ds{font-size:11px;opacity:.75}
.dis .key{position:absolute;top:4px;left:7px;font-size:11px;opacity:.55;font-weight:700}
.dis.sel{border-color:var(--accent2);background:#4a5f8f;transform:translateY(-3px);box-shadow:0 4px 0 #b8860b}
.dis .cdv{position:absolute;inset:0;background:rgba(10,15,30,.65);transform-origin:bottom;transform:scaleY(0);pointer-events:none}
.dis .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;pointer-events:none;text-shadow:0 2px 4px #000}
.overlay{position:fixed;inset:0;background:rgba(20,30,50,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay.hide{display:none}
.panel{background:var(--panel);border-radius:22px;padding:22px 20px;width:100%;max-width:480px;max-height:94vh;overflow:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.35);text-align:center}
h1{margin:0;font-size:40px;letter-spacing:4px;color:var(--accent);text-shadow:3px 3px 0 #ffd666}
h2{margin:0 0 6px;font-size:28px}
.sub{color:var(--muted);margin:6px 0 16px;font-size:15px}
.modes{display:flex;flex-direction:column;gap:10px}
.mode{border:0;border-radius:16px;padding:12px 14px;text-align:left;cursor:pointer;color:#fff;font-family:inherit;display:flex;align-items:center;gap:12px}
.mode:active{transform:scale(.97)}
.mode b{font-size:19px;display:block}
.mode span{font-size:13px;opacity:.9}
.mode .em{font-size:32px}
.mode .best{margin-left:auto;font-size:12px;text-align:right;opacity:.9;white-space:nowrap}
.m-timed{background:linear-gradient(135deg,#ff7a45,#ff4d4f)}
.m-endless{background:linear-gradient(135deg,#36cfc9,#1890ff)}
.m-pop{background:linear-gradient(135deg,#9254de,#c41d7f)}
.how{margin-top:16px;text-align:left;font-size:13px;color:var(--muted);background:#f5f7fb;border-radius:14px;padding:10px 14px;line-height:1.7}
.how b{color:var(--ink)}
.big{font-size:52px;font-weight:900;color:var(--accent);margin:4px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;font-size:14px}
.stats div{background:#f5f7fb;border-radius:12px;padding:8px}
.stats b{display:block;font-size:20px}
.newrec{color:#d4380d;font-weight:900;animation:pulse .5s infinite alternate;display:inline-block}
.btns{display:flex;gap:10px;margin-top:12px}
.btn{flex:1;border:0;border-radius:14px;padding:13px;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--accent);color:#fff;box-shadow:0 4px 0 #c4501f}
.btn.sec{background:#e8ecf4;color:var(--ink);box-shadow:0 4px 0 #c5cbd8}
.btn:active{transform:translateY(3px);box-shadow:none}
@media (max-width:560px){
  #score{font-size:17px;min-width:0}
  #info{font-size:15px}
  .dis .ds{display:none}
  .dis .key{display:none}
  .dis .nm{font-size:13px}
  h1{font-size:34px}
}
@media (max-height:520px){
  .dis .ds{display:none}
  .dis .ico{font-size:20px}
  #hud{padding:4px 10px}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="score"><small>分數</small><span id="scoreNum">0</span></div>
    <div id="info"></div>
    <button class="hbtn" id="muteBtn" title="音效開關">🔊</button>
    <button class="hbtn" id="pauseBtn" title="暫停">⏸</button>
  </div>
  <div id="stage"><canvas id="c"></canvas><div id="toast"></div></div>
  <div id="bar"></div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>天災降臨</h1>
    <p class="sub">化身任性的天神，用天災把城市搞得雞飛狗跳！</p>
    <div class="modes">
      <button class="mode m-timed" data-mode="timed"><span class="em">⏱️</span><div><b>限時 60 秒</b><span>時間內拿到最高分</span></div><div class="best" data-best="timed"></div></button>
      <button class="mode m-endless" data-mode="endless"><span class="em">♾️</span><div><b>無限模式</b><span>沒有時間限制，玩到開心為止</span></div><div class="best" data-best="endless"></div></button>
      <button class="mode m-pop" data-mode="pop"><span class="em">🏙️</span><div><b>人口爆炸</b><span>人越來越多，城市擠爆就輸了</span></div><div class="best" data-best="pop"></div></button>
    </div>
    <div class="how">
      <b>玩法：</b>① 從畫面下方選一種天災 ② 點擊城市降下天災<br>
      <b>計分：</b>人類 +10、機車 +15、汽車 +20、計程車 +25、公車 +50，一次擊中 3 個以上有連殺加分！<br>
      ⚡ <b>閃電</b>：瞬間命中、範圍小、冷卻快<br>
      ☄️ <b>隕石</b>：延遲落下、超大範圍<br>
      🌪️ <b>龍捲風</b>：會自己移動，把沿路的東西捲走<br>
      👻 <b>惡靈附身</b>：點一個人讓他發狂追殺別人，殺滿 5 人就自爆！<br>
      <span style="opacity:.8">電腦可用數字鍵 1～4 快速切換天災</span>
    </div>
  </div>
</div>

<div class="overlay hide" id="pauseMenu">
  <div class="panel">
    <h2>⏸ 暫停中</h2>
    <p class="sub">天神也需要喝杯茶</p>
    <div class="btns" style="flex-direction:column">
      <button class="btn pri" id="resumeBtn">繼續遊戲</button>
      <button class="btn sec" id="finishBtn">結束這局，看結算</button>
      <button class="btn sec" id="quitBtn">回主選單</button>
    </div>
  </div>
</div>

<div class="overlay hide" id="over">
  <div class="panel">
    <h2 id="overTitle">時間到！</h2>
    <div class="big" id="overScore">0</div>
    <div id="overRec"></div>
    <div class="stats">
      <div>消滅人類<b id="stP">0</b></div>
      <div>摧毀車輛<b id="stC">0</b></div>
      <div>最高連殺<b id="stCombo">0</b></div>
      <div id="stTimeBox">遊戲時間<b id="stTime">0</b></div>
    </div>
    <div class="btns">
      <button class="btn sec" id="menuBtn">主選單</button>
      <button class="btn pri" id="againBtn">再玩一次</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   小工具
   ========================================================= */
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d'), stage = $('#stage');
const rand = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(g, x, y, w, h, r) { // 圓角矩形
  r = Math.min(r, w / 2, h / 2);
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function shade(hex, amt) { // 顏色變亮(+)或變暗(-)
  const n = parseInt(hex.slice(1), 16);
  const f = c => clamp(c + amt, 0, 255);
  return 'rgb(' + f(n >> 16) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
}
const store = {
  get(k) { try { return parseInt(localStorage.getItem('disaster_' + k) || '0', 10) || 0; } catch (e) { return 0; } },
  set(k, v) { try { localStorage.setItem('disaster_' + k, String(v)); } catch (e) {} }
};
function fmtTime(t) { t = Math.floor(t); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }

/* =========================================================
   設定值（想調整難度可以改這裡）
   ========================================================= */
const ROAD = 48, SIDE = 14, LANE = 11, SW = ROAD / 2 + SIDE / 2;
const TIME_LIMIT = 60;          // 限時模式秒數
const POP_LIMIT = 150;          // 人口爆炸模式的上限
const GHOST_KILLS = 5;          // 惡靈殺幾人後自爆
const DIS = {
  bolt:    { name: '閃電',   icon: '⚡', cd: 0.7, r: 30,  desc: '瞬間・小範圍' },
  meteor:  { name: '隕石',   icon: '☄️', cd: 3.5, r: 85,  desc: '延遲・大範圍' },
  tornado: { name: '龍捲風', icon: '🌪️', cd: 6,   r: 40,  desc: '持續移動' },
  ghost:   { name: '惡靈附身', icon: '👻', cd: 5, r: 50,  desc: '點人附身' },
};
const DIS_ORDER = ['bolt', 'meteor', 'tornado', 'ghost'];
const CARS = {
  scooter: { len: 17, wid: 8,  spd: [95, 120], pts: 15, w: 3 },
  car:     { len: 30, wid: 16, spd: [70, 92],  pts: 20, w: 5 },
  taxi:    { len: 30, wid: 16, spd: [75, 95],  pts: 25, w: 2 },
  bus:     { len: 58, wid: 19, spd: [50, 60],  pts: 50, w: 1 },
};
const CAR_COLORS = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f5f6fa', '#34495e', '#e67e22', '#ff8fab', '#1abc9c'];
const SHIRTS = ['#ff6b6b', '#4dabf7', '#51cf66', '#fcc419', '#ff922b', '#cc5de8', '#20c997', '#f06595', '#ffffff', '#845ef7'];
const HAIRS = ['#2b2b2b', '#4a3222', '#6b4423', '#1c1c1c', '#c98d4b', '#8a8a8a'];
const SKINS = ['#ffd8b5', '#f5c79e', '#e0ac7e', '#c68b59'];
const ROOFS = ['#f2b5a0', '#f7d794', '#b8d8e8', '#d6c1e8', '#f5c6d6', '#c9e4b4', '#e8e2d0', '#ffd8a8', '#a8c8f0', '#e0e0e0'];

/* =========================================================
   音效（用程式即時合成，不需要外部檔案）
   ========================================================= */
let AC = null, noiseBuf = null, muted = false, lastPop = 0;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function noise(dur, type, freq, vol, attack) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  src.buffer = noiseBuf; src.loop = true; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + (attack || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(a.destination); src.start(t); src.stop(t + dur + 0.05);
}
function tone(f1, f2, dur, type, vol) {
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
}
function sfx(k) {
  if (muted || !G || G.mode === 'demo') return;
  try {
    if (k === 'zap') { noise(0.3, 'highpass', 1800, 0.35); tone(1400, 150, 0.22, 'sawtooth', 0.08); }
    else if (k === 'boom') { noise(1.1, 'lowpass', 500, 0.8); tone(110, 30, 0.7, 'sine', 0.5); }
    else if (k === 'whoosh') { noise(1.6, 'bandpass', 450, 0.3, 0.4); }
    else if (k === 'fall') { tone(900, 200, 0.8, 'sine', 0.06); }
    else if (k === 'ghost') { tone(620, 260, 0.7, 'triangle', 0.12); tone(640, 300, 0.7, 'sine', 0.06); }
    else if (k === 'pboom') { noise(0.7, 'lowpass', 900, 0.6); tone(300, 40, 0.5, 'square', 0.12); }
    else if (k === 'pop') {
      const now = performance.now(); if (now - lastPop < 45) return; lastPop = now;
      tone(rand(600, 800), rand(1000, 1300), 0.08, 'square', 0.04);
    }
    else if (k === 'crash') { noise(0.35, 'bandpass', 1200, 0.25); }
  } catch (e) {}
}

/* =========================================================
   城市地圖：產生道路、街區、建築、公園
   ========================================================= */
let W = 1000, H = 640, view = { s: 1, ox: 0, oy: 0 }, dpr = 1, city = null, bg = null;

function chooseWorldSize() {
  const r = stage.getBoundingClientRect();
  const a = (r.width || 800) / (r.height || 600);
  if (a >= 1) { H = 680; W = clamp(Math.round(680 * a), 680, 1400); }
  else { W = 640; H = clamp(Math.round(640 / a), 640, 1300); }
}

function genCity() {
  const nv = Math.max(2, Math.round(W / 250)), nh = Math.max(2, Math.round(H / 240));
  const vr = [], hr = [];
  for (let k = 0; k < nv; k++) vr.push(Math.round((k + 0.5) * W / nv + rand(-18, 18)));
  for (let k = 0; k < nh; k++) hr.push(Math.round((k + 0.5) * H / nh + rand(-18, 18)));
  // 人行道「節點」座標：行人只沿著這些線走
  const xs = [-30], ys = [-30];
  vr.forEach(x => xs.push(x - SW, x + SW)); xs.push(W + 30);
  hr.forEach(y => ys.push(y - SW, y + SW)); ys.push(H + 30);
  // 街區
  const L = ROAD / 2 + SIDE;
  const spans = (roads, max) => {
    const out = [[-20, roads[0] - L]];
    for (let k = 0; k < roads.length - 1; k++) out.push([roads[k] + L, roads[k + 1] - L]);
    out.push([roads[roads.length - 1] + L, max + 20]);
    return out;
  };
  const blocks = [];
  for (const [x1, x2] of spans(vr, W)) for (const [y1, y2] of spans(hr, H)) {
    blocks.push({ x: x1, y: y1, w: x2 - x1, h: y2 - y1, type: Math.random() < 0.16 ? 'park' : 'bld' });
  }
  if (!blocks.some(b => b.type === 'park')) {
    const inner = blocks.filter(b => b.x > 0 && b.y > 0 && b.x + b.w < W && b.y + b.h < H);
    (inner.length ? pick(inner) : pick(blocks)).type = 'park';
  }
  for (const b of blocks) {
    if (b.type === 'bld') { b.lots = []; splitLot(b.x + 5, b.y + 5, b.w - 10, b.h - 10, b.lots, 0); }
    else {
      b.pond = b.w > 120 && b.h > 110 && Math.random() < 0.7;
      b.trees = [];
      const n = Math.round(b.w * b.h / 1800);
      for (let i = 0; i < n; i++) {
        const tx = rand(b.x + 10, b.x + b.w - 10), ty = rand(b.y + 10, b.y + b.h - 10);
        if (b.pond && d2(tx, ty, b.x + b.w / 2, b.y + b.h / 2) < Math.pow(Math.min(b.w, b.h) * 0.32, 2)) continue;
        b.trees.push({ x: tx, y: ty, r: rand(7, 13), c: pick(['#3f9b45', '#4caf50', '#2e8b57', '#5cb85c']) });
      }
    }
  }
  city = { vr, hr, xs, ys, blocks };
}

function splitLot(x, y, w, h, out, depth) {
  const big = Math.max(w, h);
  if (depth < 4 && big > 115 && !(big < 150 && Math.random() < 0.3)) {
    const r = rand(0.35, 0.65);
    if (w >= h) { const w1 = w * r - 4; splitLot(x, y, w1, h, out, depth + 1); splitLot(x + w1 + 8, y, w - w1 - 8, h, out, depth + 1); }
    else { const h1 = h * r - 4; splitLot(x, y, w, h1, out, depth + 1); splitLot(x, y + h1 + 8, w, h - h1 - 8, out, depth + 1); }
    return;
  }
  const lot = { x, y, w, h, c: pick(ROOFS), items: [] };
  const nt = ri(0, 2); // 頂樓水塔（台灣特色！）
  for (let i = 0; i < nt; i++) lot.items.push({ t: 'tank', x: rand(x + 14, x + w - 14), y: rand(y + 14, y + h - 14), r: rand(5, 7) });
  const na = ri(0, 3); // 冷氣室外機
  for (let i = 0; i < na; i++) lot.items.push({ t: 'ac', x: rand(x + 10, x + w - 18), y: rand(y + 10, y + h - 16) });
  if (Math.random() < 0.5) lot.items.push({ t: 'stair', x: rand(x + 10, x + w - 26), y: rand(y + 10, y + h - 24) });
  out.push(lot);
}

function renderBG() {
  const sc = Math.min(view.s * dpr, 3);
  bg = document.createElement('canvas');
  bg.width = Math.ceil(W * sc); bg.height = Math.ceil(H * sc);
  const g = bg.getContext('2d'); g.scale(sc, sc);
  g.fillStyle = '#8fcf6a'; g.fillRect(0, 0, W, H);
  const { vr, hr, blocks } = city;
  // 街區
  for (const b of blocks) {
    if (b.type === 'park') {
      g.fillStyle = '#86cf64'; rr(g, b.x, b.y, b.w, b.h, 8); g.fill();
      g.strokeStyle = '#f1e3c2'; g.lineWidth = 7; rr(g, b.x + 16, b.y + 16, b.w - 32, b.h - 32, 18); g.stroke();
      if (b.pond) {
        const cx = b.x + b.w / 2, cy = b.y + b.h / 2, rx = b.w * 0.24, ry = b.h * 0.2;
        g.fillStyle = '#5bb6e8'; g.beginPath(); g.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(cx - rx * 0.3, cy - ry * 0.3, rx * 0.35, ry * 0.18, -0.3, 0, Math.PI * 2); g.fill();
      }
      for (const t of b.trees) {
        g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.arc(t.x + 3, t.y + 3, t.r, 0, Math.PI * 2); g.fill();
        g.fillStyle = t.c; g.beginPath(); g.arc(t.x, t.y, t.r, 0, Math.PI * 2); g.fill();
        g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath(); g.arc(t.x - t.r * 0.3, t.y - t.r * 0.3, t.r * 0.45, 0, Math.PI * 2); g.fill();
      }
    } else {
      g.fillStyle = '#d6cfc0'; rr(g, b.x, b.y, b.w, b.h, 6); g.fill();
      for (const l of b.lots) drawBuilding(g, l);
    }
  }
  // 人行道
  g.fillStyle = '#efe6d4';
  for (const x of vr) g.fillRect(x - ROAD / 2 - SIDE, -5, ROAD + SIDE * 2, H + 10);
  for (const y of hr) g.fillRect(-5, y - ROAD / 2 - SIDE, W + 10, ROAD + SIDE * 2);
  // 馬路
  g.fillStyle = '#596070';
  for (const x of vr) g.fillRect(x - ROAD / 2, -5, ROAD, H + 10);
  for (const y of hr) g.fillRect(-5, y - ROAD / 2, W + 10, ROAD);
  // 路緣
  g.strokeStyle = '#cbbfa6'; g.lineWidth = 1.5;
  for (const x of vr) for (const s of [-1, 1]) { g.beginPath(); g.moveTo(x + s * (ROAD / 2 + SIDE), -5); g.lineTo(x + s * (ROAD / 2 + SIDE), H + 5); g.stroke(); }
  for (const y of hr) for (const s of [-1, 1]) { g.beginPath(); g.moveTo(-5, y + s * (ROAD / 2 + SIDE)); g.lineTo(W + 5, y + s * (ROAD / 2 + SIDE)); g.stroke(); }
  // 重新塗路口（蓋掉人行道與路緣）
  g.fillStyle = '#596070';
  for (const x of vr) for (const y of hr) g.fillRect(x - ROAD / 2, y - ROAD / 2 - SIDE - 1, ROAD, ROAD + SIDE * 2 + 2);
  for (const x of vr) for (const y of hr) g.fillRect(x - ROAD / 2 - SIDE - 1, y - ROAD / 2, ROAD + SIDE * 2 + 2, ROAD);
  // 道路中線（虛線）
  g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 2; g.setLineDash([14, 12]);
  const E = ROAD / 2 + SIDE + 2;
  const segs = (cross, max) => { const s = []; let p = -5; for (const c of cross) { s.push([p, c - E]); p = c + E; } s.push([p, max + 5]); return s; };
  for (const x of vr) for (const [a, b] of segs(hr, H)) { g.beginPath(); g.moveTo(x, a); g.lineTo(x, b); g.stroke(); }
  for (const y of hr) for (const [a, b] of segs(vr, W)) { g.beginPath(); g.moveTo(a, y); g.lineTo(b, y); g.stroke(); }
  g.setLineDash([]);
  // 斑馬線
  g.fillStyle = 'rgba(255,255,255,.85)';
  for (const x of vr) for (const y of hr) {
    for (const s of [-1, 1]) {
      const cy = y + s * (ROAD / 2 + SIDE / 2);
      for (let k = -ROAD / 2 + 4; k < ROAD / 2 - 3; k += 8) g.fillRect(x + k, cy - SIDE / 2 + 2, 4, SIDE - 4);
      const cx = x + s * (ROAD / 2 + SIDE / 2);
      for (let k = -ROAD / 2 + 4; k < ROAD / 2 - 3; k += 8) g.fillRect(cx - SIDE / 2 + 2, y + k, SIDE - 4, 4);
    }
  }
}

function drawBuilding(g, l) {
  if (l.w < 8 || l.h < 8) return;

/* =========================================================
   遊戲狀態
   ========================================================= */
let G = null;
function newState(mode) {
  return {
    mode, t: 0, score: 0, killsP: 0, killsC: 0, maxCombo: 0,
    people: [], cars: [], fx: [], decals: [], wrecks: [], floaters: [], meteors: [], tornados: [],
    spawnP: 0, spawnC: 0, shake: 0, flash: 0, over: false, paused: false,
    cd: { bolt: 0, meteor: 0, tornado: 0, ghost: 0 }, sel: (G && G.sel) || 'bolt', hover: null, carId: 0,
  };
}
const area = () => W * H / 640000;

/* ---------- 行人 ---------- */
function newPerson(edge) {
  const nx = city.xs.length, ny = city.ys.length;
  const p = {
    spd: rand(26, 40), shirt: pick(SHIRTS), hair: pick(HAIRS), skin: pick(SKINS),
    ang: 0, ph: rand(0, 6), flee: 0, state: 'walk', born: edge ? 1 : 0, jx: rand(-3, 3), jy: rand(-3, 3), pi: -1, pj: -1,
  };
  if (edge) {
    const side = ri(0, 3);
    if (side === 0) { p.ci = 0; p.cj = ri(1, ny - 2); p.ti = 1; p.tj = p.cj; }
    else if (side === 1) { p.ci = nx - 1; p.cj = ri(1, ny - 2); p.ti = nx - 2; p.tj = p.cj; }
    else if (side === 2) { p.cj = 0; p.ci = ri(1, nx - 2); p.tj = 1; p.ti = p.ci; }
    else { p.cj = ny - 1; p.ci = ri(1, nx - 2); p.tj = ny - 2; p.ti = p.ci; }
    p.x = city.xs[p.ci] + p.jx; p.y = city.ys[p.cj] + p.jy;
  } else {
    p.ci = ri(1, nx - 2); p.cj = ri(1, ny - 2);
    p.x = city.xs[p.ci] + p.jx; p.y = city.ys[p.cj] + p.jy;
    nextNode(p);
    // 隨機放在路段中間，看起來比較自然
    const k = Math.random();
    p.x += (city.xs[p.ti] + p.jx - p.x) * k; p.y += (city.ys[p.tj] + p.jy - p.y) * k;
  }
  p.ang = Math.atan2(city.ys[p.tj] - city.ys[p.cj], city.xs[p.ti] - city.xs[p.ci]);
  return p;
}
const isEdge = (i, j) => i === 0 || j === 0 || i === city.xs.length - 1 || j === city.ys.length - 1;
function nextNode(p) {
  const nx = city.xs.length, ny = city.ys.length;
  let opts = [[p.ci + 1, p.cj], [p.ci - 1, p.cj], [p.ci, p.cj + 1], [p.ci, p.cj - 1]]
    .filter(([i, j]) => i >= 0 && j >= 0 && i < nx && j < ny);
  if (G.mode === 'pop') opts = opts.filter(([i, j]) => !isEdge(i, j));
  else if (Math.random() < 0.7) { const o = opts.filter(([i, j]) => !isEdge(i, j)); if (o.length) opts = o; }
  const o2 = opts.filter(([i, j]) => !(i === p.pi && j === p.pj));
  if (o2.length) opts = o2;
  if (!opts.length) opts = [[p.pi, p.pj]];
  let ch;
  if (p.flee > 0 && p.dx_ !== undefined) {
    ch = opts.reduce((best, o) => d2(city.xs[o[0]], city.ys[o[1]], p.dx_, p.dy_) > d2(city.xs[best[0]], city.ys[best[1]], p.dx_, p.dy_) ? o : best, opts[0]);
  } else ch = pick(opts);
  p.pi = p.ci; p.pj = p.cj; p.ti = ch[0]; p.tj = ch[1];
}
function updatePerson(p, dt) {
  if (p.born < 1) p.born = Math.min(1, p.born + dt * 3);
  if (p.state === 'possessed') return updatePossessed(p, dt);
  p.flee -= dt;
  const sp = p.spd * (p.flee > 0 ? 2.3 : 1);
  const tx = city.xs[p.ti] + p.jx, ty = city.ys[p.tj] + p.jy;
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  p.ph += sp * dt * 0.28;
  if (d <= sp * dt) {
    p.x = tx; p.y = ty; p.ci = p.ti; p.cj = p.tj;
    if (isEdge(p.ci, p.cj) && G.mode !== 'pop') { p.gone = true; return; }
    nextNode(p);
  } else {
    p.x += dx / d * sp * dt; p.y += dy / d * sp * dt; p.ang = Math.atan2(dy, dx);
  }
}

/* ---------- 惡靈附身 ---------- */
function updatePossessed(p, dt) {
  p.pt += dt;
  let best = null, bd = 1e12;
  for (const o of G.people) {
    if (o === p || o.dead || o.state === 'possessed') continue;
    const dd = d2(p.x, p.y, o.x, o.y); if (dd < bd) { bd = dd; best = o; }
  }
  const sp = 105;
  if (best) {
    const d = Math.sqrt(bd);
    if (d < 11) {
      kill(best, 'ghost'); p.kills++;
      G.fx.push({ k: 'ring', x: best.x, y: best.y, r0: 4, r1: 26, t: 0, life: 0.35, c: '180,60,255' });
      if (p.kills >= GHOST_KILLS) return possessedBoom(p);
    } else {
      p.x += (best.x - p.x) / d * sp * dt; p.y += (best.y - p.y) / d * sp * dt; p.ang = Math.atan2(best.y - p.y, best.x - p.x);
      if (d < 200) { best.flee = Math.max(best.flee, 1); best.dx_ = p.x; best.dy_ = p.y; }
    }
  }
  p.ph += sp * dt * 0.35;
  p.x = clamp(p.x, 5, W - 5); p.y = clamp(p.y, 5, H - 5);
  if (p.pt > 12) possessedBoom(p);
}
function possessedBoom(p) {
  if (p.dead) return;
  const x = p.x, y = p.y;
  G.fx.push({ k: 'ring', x, y, r0: 10, r1: 110, t: 0, life: 0.55, c: '170,60,255' });

  G.decals.push({ k: 'scorch', x, y, r: 45, t: 0, life: 12, c: '90,20,120' });
  G.shake = Math.max(G.shake, 0.6); G.flash = 0.2; G.flashC = '200,120,255';
  floater(x, y - 22, '惡靈自爆！', '#d3adf7', 18);

}

/* ---------- 車輛 ---------- */
function newCar(randomPos) {
  const tot = Object.values(CARS).reduce((s, c) => s + c.w, 0);
  let r = Math.random() * tot, kind = 'car';
  for (const k in CARS) { r -= CARS[k].w; if (r <= 0) { kind = k; break; } }
  const spec = CARS[kind], { vr, hr } = city;
  const idx = ri(0, vr.length + hr.length - 1);
  const c = { kind, len: spec.len, wid: spec.wid, max: rand(spec.spd[0], spec.spd[1]), id: G.carId++, turned: false };
  c.spd = c.max;
  if (idx < vr.length) {
    c.dx = 0; c.dy = pick([1, -1]); c.x = vr[idx] - LANE * c.dy; c.y = c.dy > 0 ? -40 : H + 40;
    if (randomPos) c.y = rand(0, H);
    if (Math.random() < 0.5) { c.turnK = ri(0, hr.length - 1); c.turnD = pick([1, -1]); }
  } else {
    c.dy = 0; c.dx = pick([1, -1]); c.y = hr[idx - vr.length] + LANE * c.dx; c.x = c.dx > 0 ? -40 : W + 40;
    if (randomPos) c.x = rand(0, W);
    if (Math.random() < 0.5) { c.turnK = ri(0, vr.length - 1); c.turnD = pick([1, -1]); }
  }
  c.ang = Math.atan2(c.dy, c.dx);
  c.color = kind === 'taxi' ? '#f7c600' : kind === 'bus' ? pick(['#2e86de', '#27ae60', '#e17055']) : pick(CAR_COLORS);
  c.helmet = pick(['#ff6b6b', '#ffffff', '#fcc419', '#4dabf7', '#222']);
  for (const o of G.cars) if (o.dx === c.dx && o.dy === c.dy && d2(o.x, o.y, c.x, c.y) < 75 * 75) return null;
  return c;
}
function updateCar(c, dt) {
  let target = c.max;
  for (const o of G.cars) {
    if (o === c || o.dead) continue;
    const rx = o.x - c.x, ry = o.y - c.y;
    const along = rx * c.dx + ry * c.dy, lat = Math.abs(rx * c.dy - ry * c.dx);
    if (along <= 0 || along > 90) continue;
    const same = o.dx === c.dx && o.dy === c.dy;
    if (same && lat < 6) {
      const gap = along - (c.len + o.len) / 2;
      if (gap < 6) target = 0; else if (gap < 22) target = Math.min(target, o.spd * 0.9);
    } else if (!same && lat < (o.len / 2 + 6) && along < c.len / 2 + o.wid / 2 + 14 && c.id > o.id) {
      target = 0; // 路口禮讓
    }
  }
  c.spd += (target - c.spd) * Math.min(1, dt * 5);
  const px = c.x, py = c.y;
  c.x += c.dx * c.spd * dt; c.y += c.dy * c.spd * dt;
  if (c.turnK !== undefined && !c.turned) {
    if (c.dx !== 0) {
      const trig = city.vr[c.turnK] - LANE * c.turnD;
      if ((trig - px) * (trig - c.x) <= 0) { c.x = trig; c.dx = 0; c.dy = c.turnD; c.turned = true; }
    } else {
      const trig = city.hr[c.turnK] + LANE * c.turnD;
      if ((trig - py) * (trig - c.y) <= 0) { c.y = trig; c.dy = 0; c.dx = c.turnD; c.turned = true; }
    }
  }
  const ta = Math.atan2(c.dy, c.dx);
  let da = ta - c.ang; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
  c.ang += da * Math.min(1, dt * 9);
  if (c.x < -90 || c.x > W + 90 || c.y < -90 || c.y > H + 90) c.gone = true;
}

/* ---------- 擊殺與計分 ---------- */
function floater(x, y, text, color, size) { G.floaters.push({ x, y, text, color: color || '#ffe066', size: size || 14, t: 0, life: 1 }); }
function kill(e, style) {

function killArea(x, y, r, style) {

function updateTornado(t, dt) {

  // 稍微朝最近的目標移動，比較好用
  let best = null, bd = 230 * 230;
  for (const arr of [G.people, G.cars]) for (const e of arr) { if (e.dead) continue; const dd = d2(e.x, e.y, t.x, t.y); if (dd < bd) { bd = dd; best = e; } }
  if (best) {
    const ta = Math.atan2(best.y - t.y, best.x - t.x);
    let da = ta - t.ang; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
    t.ang += da * Math.min(1, dt * 1.6);
  }
  t.ang += rand(-1, 1) * dt * 2.5;
  const sp = 85;
  t.x += Math.cos(t.ang) * sp * dt; t.y += Math.sin(t.ang) * sp * dt;
  if (t.x < 20 || t.x > W - 20) { t.ang = Math.PI - t.ang; t.x = clamp(t.x, 20, W - 20); }
  if (t.y < 20 || t.y > H - 20) { t.ang = -t.ang; t.y = clamp(t.y, 20, H - 20); }
  if (t.t < t.life - 0.3) {
    const r = DIS.tornado.r;
    for (const p of G.people) if (!p.dead && d2(p.x, p.y, t.x, t.y) < r * r) kill(p, 'fling');
    for (const c of G.cars) if (!c.dead && d2(c.x, c.y, t.x, t.y) < Math.pow(r + c.len * 0.3, 2)) kill(c, 'fling');
    t.nextAlarm -= dt; if (t.nextAlarm <= 0) { alarm(t.x, t.y, 160); t.nextAlarm = 0.5; }
  }
  if (Math.random() < dt * 25) G.fx.push({ k: 'smoke', x: t.x + rand(-20, 20), y: t.y + rand(-6, 10), vx: rand(-40, 40), vy: rand(-10, 10), r: rand(5, 10), t: 0, life: 0.7 });
}

/* ---------- 每一幀的更新 ---------- */
function spawn(dt) {
  if (G.mode === 'pop') {
    const rateP = 1.1 + G.t * 0.035, rateC = 0.45 + G.t * 0.006;
    G.spawnP -= dt; while (G.spawnP <= 0) { G.people.push(newPerson(Math.random() < 0.5)); G.spawnP += 1 / rateP; }
    G.spawnC -= dt; while (G.spawnC <= 0) { const c = newCar(false); if (c) G.cars.push(c); G.spawnC += 1 / rateC; }
  } else {
    const tp = Math.round(55 * area()), tc = Math.round(16 * area());
    G.spawnP -= dt; if (G.spawnP <= 0 && G.people.length < tp) { G.people.push(newPerson(Math.random() < 0.55)); G.spawnP = 0.16; }
    G.spawnC -= dt; if (G.spawnC <= 0 && G.cars.length < tc) { const c = newCar(false); if (c) G.cars.push(c); G.spawnC = 0.45; }
  }
}
function update(dt) {
  G.t += dt;
  for (const k in G.cd) G.cd[k] = Math.max(0, G.cd[k] - dt);
  spawn(dt);
  for (const p of G.people) if (!p.dead) updatePerson(p, dt);
  for (const c of G.cars) if (!c.dead) updateCar(c, dt);
  for (const m of G.meteors) { m.t += dt; if (m.t >= m.dur && !m.done) { m.done = true; meteorImpact(m); } }
  for (const t of G.tornados) updateTornado(t, dt);
  for (const f of G.fx) {
    f.t += dt;
    if (f.k === 'p' || f.k === 'smoke') { f.x += f.vx * dt; f.y += f.vy * dt; const dr = Math.exp(-(f.drag || 1) * dt); f.vx *= dr; f.vy *= dr; }
    else if (f.k === 'fling') { f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.spin * dt; }
  }
  for (const w of G.wrecks) { w.t += dt; if (w.t < w.life - 1.5 && Math.random() < dt * 4) G.fx.push({ k: 'smoke', x: w.x + rand(-5, 5), y: w.y, vx: rand(-8, 8), vy: rand(-25, -12), r: rand(4, 7), t: 0, life: 1.2 }); }
  for (const f of G.floaters) f.t += dt;
  for (const d of G.decals) d.t += dt;
  G.people = G.people.filter(p => !p.dead && !p.gone);
  G.cars = G.cars.filter(c => !c.dead && !c.gone);
  G.meteors = G.meteors.filter(m => !m.done);
  G.tornados = G.tornados.filter(t => t.t < t.life);
  G.fx = G.fx.filter(f => f.t < f.life);
  G.wrecks = G.wrecks.filter(w => w.t < w.life);
  G.floaters = G.floaters.filter(f => f.t < f.life);
  G.decals = G.decals.filter(d => d.t < d.life); if (G.decals.length > 40) G.decals.splice(0, G.decals.length - 40);
  G.shake = Math.max(0, G.shake - dt * 2.5);
  G.flash = Math.max(0, G.flash - dt * 1.4);
  if (G.mode === 'timed' && G.t >= TIME_LIMIT) endGame('時間到！');
  if (G.mode === 'pop' && G.people.length + G.cars.length >= POP_LIMIT) endGame('人口爆炸了！');
}

/* =========================================================
   繪圖
   ========================================================= */
function drawPerson(g, p) {
  const b = p.born < 1 ? 0.3 + 0.7 * p.born + Math.sin(p.born * Math.PI) * 0.25 : 1;
  const poss = p.state === 'possessed';
  g.save(); g.translate(p.x, p.y);
  if (poss) {
    const pr = 13 + Math.sin(G.t * 10) * 2.5;
    const grd = g.createRadialGradient(0, 0, 2, 0, 0, pr + 6);
    grd.addColorStop(0, 'rgba(170,60,255,.65)'); grd.addColorStop(1, 'rgba(170,60,255,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(0, 0, pr + 6, 0, 7); g.fill();

  g.scale(b, b);
  g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(1.5, 2.5, 7, 5, 0, 0, 7); g.fill();
  g.rotate(p.ang);
  const sw = Math.sin(p.ph) * 2.6;
  g.fillStyle = poss ? '#7a4a8c' : p.skin;
  g.beginPath(); g.arc(sw, -6.6, 2, 0, 7); g.fill();
  g.beginPath(); g.arc(-sw, 6.6, 2, 0, 7); g.fill();
  g.fillStyle = poss ? '#531dab' : p.shirt;
  g.beginPath(); g.ellipse(0, 0, 4.6, 7, 0, 0, 7); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.25)'; g.lineWidth = 1; g.stroke();
  g.fillStyle = poss ? '#2b1640' : p.hair; g.beginPath(); g.arc(0, 0, 4.8, 0, 7); g.fill();
  g.fillStyle = poss ? '#8c6aa3' : p.skin; g.beginPath(); g.arc(1.8, 0, 3.1, -1.3, 1.3); g.closePath(); g.fill();
  if (poss) { g.fillStyle = '#ff1f1f'; g.beginPath(); g.arc(3.2, -1.7, 1.2, 0, 7); g.arc(3.2, 1.7, 1.2, 0, 7); g.fill(); }
  g.restore();
  if (poss) {
    g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.lineWidth = 3; g.strokeStyle = '#2b1640';
    const s = p.kills + '/' + GHOST_KILLS; g.strokeText(s, p.x, p.y - 15); g.fillStyle = '#ffadd2'; g.fillText(s, p.x, p.y - 15);
  } else if (p.flee > 0) {
    g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.lineWidth = 3; g.strokeStyle = '#fff';
    g.strokeText('!', p.x, p.y - 11); g.fillStyle = '#f5222d'; g.fillText('!', p.x, p.y - 11);
  }
}
function drawCarShape(g, c, burnt) {

  g.strokeStyle = burnt ? '#1f1f1f' : 'rgba(0,0,0,.35)'; g.lineWidth = 1.4; g.stroke();

    g.fillStyle = '#9fd3f0'; rr(g, L / 2 - 6, -Wd / 2 + 2, 4, Wd - 4, 1.5); g.fill();
  } else {
    g.fillStyle = '#9fd3f0'; rr(g, L / 2 - L * 0.33, -Wd / 2 + 2, L * 0.15, Wd - 4, 2); g.fill();
    g.fillStyle = '#7fb8d8'; rr(g, -L / 2 + L * 0.1, -Wd / 2 + 2.5, L * 0.12, Wd - 5, 2); g.fill();

  }
  g.fillStyle = '#fff6b0'; g.beginPath(); g.arc(L / 2 - 1, -Wd / 2 + 3, 1.6, 0, 7); g.arc(L / 2 - 1, Wd / 2 - 3, 1.6, 0, 7); g.fill();
  g.fillStyle = '#ff4d4f'; g.fillRect(-L / 2, -Wd / 2 + 2, 1.6, 3); g.fillRect(-L / 2, Wd / 2 - 5, 1.6, 3);
}
function drawSoul(g, x, y, s, a) {
  g.globalAlpha = a;
  g.fillStyle = '#ffffff'; g.strokeStyle = 'rgba(120,130,160,.6)'; g.lineWidth = 1;
  g.beginPath(); g.arc(x, y, 6 * s, Math.PI, 0); g.lineTo(x + 6 * s, y + 7 * s);
  for (let i = 0; i < 3; i++) { const bx = x + 6 * s - (i + 0.5) * 4 * s; g.quadraticCurveTo(bx, y + 4 * s, bx - 2 * s, y + 7 * s); }

  g.fillStyle = '#333'; g.beginPath(); g.arc(x - 2.2 * s, y - 0.5 * s, 1.1 * s, 0, 7); g.arc(x + 2.2 * s, y - 0.5 * s, 1.1 * s, 0, 7); g.fill();
  g.globalAlpha = 1;
}
function drawTornado(g, t) {
  const a = Math.min(1, t.t / 0.3, (t.life - t.t) / 0.4);
  g.save(); g.globalAlpha = Math.max(0, a);
  g.fillStyle = 'rgba(80,70,60,.25)'; g.beginPath(); g.ellipse(t.x, t.y + 4, 44, 20, 0, 0, 7); g.fill();
  for (let i = 0; i < 9; i++) {
    const rx = 9 + i * 5.2, ry = rx * 0.38, ox = Math.sin(t.spin * 0.6 + i * 0.7) * i * 1.6;
    g.strokeStyle = 'rgba(' + (190 - i * 6) + ',' + (195 - i * 6) + ',' + (205 - i * 4) + ',' + (0.9 - i * 0.05) + ')';
    g.lineWidth = 5; g.beginPath(); g.ellipse(t.x + ox, t.y - i * 8, rx, ry, 0, t.spin + i, t.spin + i + 4.6); g.stroke();
  }
  g.fillStyle = '#6b5b4b';
  for (let i = 0; i < 6; i++) { const aa = t.spin * 1.3 + i * 1.05, rr2 = 18 + (i % 3) * 12; g.fillRect(t.x + Math.cos(aa) * rr2 - 2, t.y - 10 - (i % 3) * 14 + Math.sin(aa) * rr2 * 0.4 - 2, 4, 4); }
  g.restore();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#6fb24e'; ctx.fillRect(0, 0, cv.width, cv.height);
  if (!G || !bg) return;
  const s = view.s * dpr;
  const sx = G.shake > 0 ? rand(-1, 1) * G.shake * 10 : 0, sy = G.shake > 0 ? rand(-1, 1) * G.shake * 10 : 0;
  ctx.setTransform(s, 0, 0, s, view.ox * dpr + sx * s, view.oy * dpr + sy * s);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  ctx.drawImage(bg, 0, 0, W, H);
  // 地面痕跡
  for (const d of G.decals) {
    const a = Math.min(1, (d.life - d.t) / 3);
    ctx.globalAlpha = a;
    if (d.k === 'crater') {
      ctx.fillStyle = 'rgba(60,45,35,.55)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(40,30,25,.7)'; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.62, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(120,100,80,.6)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.62, 0, 7); ctx.stroke();
    } else {
      const grd = ctx.createRadialGradient(d.x, d.y, 2, d.x, d.y, d.r);
      grd.addColorStop(0, 'rgba(' + d.c + ',.6)'); grd.addColorStop(1, 'rgba(' + d.c + ',0)');
      ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  for (const w of G.wrecks) {
    ctx.globalAlpha = Math.min(1, (w.life - w.t) / 1.5);
    ctx.save(); ctx.translate(w.x, w.y); ctx.rotate(w.ang); drawCarShape(ctx, w, true); ctx.restore();
    if (w.t < w.life - 2) { ctx.fillStyle = Math.random() < 0.5 ? '#ff7a00' : '#ffd000'; ctx.beginPath(); ctx.arc(w.x + rand(-3, 3), w.y + rand(-3, 3), rand(2, 4.5), 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // 隕石落點陰影
  for (const m of G.meteors) {
    const k = m.t / m.dur, r = DIS.meteor.r;
    ctx.fillStyle = 'rgba(0,0,0,' + (0.1 + 0.3 * k) + ')'; ctx.beginPath(); ctx.arc(m.x, m.y, r * (0.25 + 0.75 * k), 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,60,60,.85)'; ctx.lineWidth = 3; ctx.setLineDash([10, 8]); ctx.lineDashOffset = -G.t * 40;
    ctx.beginPath(); ctx.arc(m.x, m.y, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const c of G.cars) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.ang); drawCarShape(ctx, c, false); ctx.restore(); }
  for (const p of G.people) drawPerson(ctx, p);
  // 特效
  for (const f of G.fx) {
    const k = f.t / f.life;
    if (f.k === 'p') { ctx.globalAlpha = 1 - k; ctx.fillStyle = f.c; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 - k * 0.5), 0, 7); ctx.fill(); }
    else if (f.k === 'smoke') { ctx.globalAlpha = 0.45 * (1 - k); ctx.fillStyle = '#7d7d7d'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r * (1 + k * 1.5), 0, 7); ctx.fill(); }
    else if (f.k === 'ring') { ctx.globalAlpha = 1 - k; ctx.strokeStyle = 'rgba(' + f.c + ',1)'; ctx.lineWidth = 6 * (1 - k) + 1; ctx.beginPath(); ctx.arc(f.x, f.y, f.r0 + (f.r1 - f.r0) * Math.sqrt(k), 0, 7); ctx.stroke(); }
    else if (f.k === 'soul') { drawSoul(ctx, f.x + Math.sin(f.t * 6 + f.sway) * 3, f.y - 6 - f.t * 32, 1, 1 - k); }

  }
  ctx.globalAlpha = 1;
  for (const t of G.tornados) drawTornado(ctx, t);
  // 空中的隕石
  for (const m of G.meteors) {
    const k = m.t / m.dur, e = k * k;
    const mx = m.sx + (m.x - m.sx) * e, my = m.sy + (m.y - m.sy) * e;
    const ang = Math.atan2(m.y - m.sy, m.x - m.sx);

    grd.addColorStop(0, 'rgba(255,200,80,.95)'); grd.addColorStop(1, 'rgba(255,80,0,0)');

    ctx.fillStyle = 'rgba(255,170,60,.5)'; ctx.beginPath(); ctx.arc(mx, my, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#7a4b2a'; ctx.beginPath(); ctx.arc(mx, my, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#5c3820'; ctx.beginPath(); ctx.arc(mx - 4, my + 3, 3.5, 0, 7); ctx.arc(mx + 4, my - 2, 2.5, 0, 7); ctx.fill();
  }
  // 滑鼠範圍提示
  if (G.hover && G.mode !== 'demo' && !G.over && !G.paused) {
    const r = DIS[G.sel].r, ready = G.cd[G.sel] <= 0;
    ctx.strokeStyle = ready ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.arc(G.hover.x, G.hover.y, r, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }

  ctx.textAlign = 'center';
  for (const f of G.floaters) {
    const k = f.t / f.life;
    ctx.globalAlpha = 1 - k * k; ctx.font = '900 ' + f.size + 'px "PingFang TC","Microsoft JhengHei",sans-serif';
    const y = f.y - k * 26;
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,30,50,.85)'; ctx.strokeText(f.text, f.x, y); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, y);
  }

  ctx.restore();
  // 全螢幕閃光、人口過多警示

  if (G.mode === 'pop') {
    const r = (G.people.length + G.cars.length) / POP_LIMIT;
    if (r > 0.75) {
      const a = (r - 0.75) * 2.2 * (0.6 + 0.4 * Math.sin(G.t * 8));
      const grd = ctx.createRadialGradient(cv.width / 2, cv.height / 2, Math.min(cv.width, cv.height) * 0.35, cv.width / 2, cv.height / 2, Math.max(cv.width, cv.height) * 0.7);
      grd.addColorStop(0, 'rgba(255,0,0,0)'); grd.addColorStop(1, 'rgba(255,0,0,' + a + ')');
      ctx.fillStyle = grd; ctx.fillRect(0, 0, cv.width, cv.height);
    }
  }
}

  const info = $('#info');
  let html, warn = false;
  if (G.mode === 'timed') { const left = Math.max(0, TIME_LIMIT - G.t); html = '⏱ ' + Math.ceil(left) + ' 秒'; warn = left <= 10; }
  else if (G.mode === 'endless') html = '♾️ ' + fmtTime(G.t);
  else {
    const n = G.people.length + G.cars.length, r = n / POP_LIMIT;
    const col = r > 0.8 ? '#ff4d4f' : r > 0.55 ? '#faad14' : '#52c41a';
    html = '人口 <span class="popbar"><i style="width:' + Math.min(100, r * 100).toFixed(1) + '%;background:' + col + '"></i></span> ' + n + '/' + POP_LIMIT;
    warn = r > 0.85;
  }
  if (html !== lastHud) { info.innerHTML = html; lastHud = html; }
  info.classList.toggle('warn', warn);
}

function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.max(1, Math.round(r.width * dpr)); cv.height = Math.max(1, Math.round(r.height * dpr));
  cv.style.width = r.width + 'px'; cv.style.height = r.height + 'px';
  const s = Math.min(r.width / W, r.height / H);
  view = { s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2 };
  if (city) renderBG();
}
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); });

function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - view.ox) / view.s, y: (e.clientY - r.top - view.oy) / view.s };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toWorld(e);
  if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) return;
  useDisaster(G.sel, p.x, p.y);
});
cv.addEventListener('pointermove', e => { if (G && e.pointerType === 'mouse') G.hover = toWorld(e); });
cv.addEventListener('pointerleave', () => { if (G) G.hover = null; });
window.addEventListener('keydown', e => {
  if (!G || G.mode === 'demo') return;
  const i = parseInt(e.key, 10);
  if (i >= 1 && i <= 4) selectDis(DIS_ORDER[i - 1]);
  if (e.key === 'Escape' || e.key === 'p') togglePause();
});

function showOnly(id) { for (const o of ['menu', 'pauseMenu', 'over']) $('#' + o).classList.toggle('hide', o !== id); }
function refreshBest() {
  document.querySelectorAll('[data-best]').forEach(el => { const v = store.get('best_' + el.dataset.best); el.innerHTML = v ? '最高分<br><b style="font-size:16px;display:inline">' + v + '</b>' : ''; });
}
function seed(nP, nC) {
  for (let i = 0; i < nP; i++) G.people.push(newPerson(false));
  for (let i = 0; i < nC; i++) { const c = newCar(true); if (c) G.cars.push(c); }
  for (const p of G.people) p.born = 1;
}
function startGame(mode) {
  chooseWorldSize(); genCity();
  const prevSel = G && G.sel;
  G = newState(mode); if (prevSel) G.sel = prevSel;
  resize();
  if (mode === 'pop') seed(40, 8); else seed(Math.round(40 * area()), Math.round(12 * area()));
  lastHud = '';
  selectDis(G.sel);
  showOnly(mode === 'demo' ? 'menu' : null);
  $('#pauseBtn').textContent = '⏸';
}
function endGame(title) {
  if (G.over) return;
  G.over = true;
  $('#overTitle').textContent = title;
  $('#overScore').textContent = G.score;
  $('#stP').textContent = G.killsP; $('#stC').textContent = G.killsC; $('#stCombo').textContent = G.maxCombo;
  $('#stTime').textContent = fmtTime(G.t);
  const key = 'best_' + G.mode, best = store.get(key);
  if (G.score > best) { store.set(key, G.score); $('#overRec').innerHTML = '<span class="newrec">🎉 新紀錄！</span>'; }
  else $('#overRec').innerHTML = '<span style="color:#6b7895">最高紀錄：' + best + '</span>';
  setTimeout(() => showOnly('over'), 600);
}
function togglePause() {
  if (!G || G.mode === 'demo' || G.over) return;
  G.paused = !G.paused;
  showOnly(G.paused ? 'pauseMenu' : null);
}
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => { audio(); startGame(b.dataset.mode); }));
$('#pauseBtn').addEventListener('click', togglePause);
$('#resumeBtn').addEventListener('click', togglePause);
$('#finishBtn').addEventListener('click', () => { G.paused = false; showOnly(null); endGame('本局結束'); });
$('#quitBtn').addEventListener('click', goMenu);
$('#menuBtn').addEventListener('click', goMenu);
$('#againBtn').addEventListener('click', () => startGame(G.mode));
$('#muteBtn').addEventListener('click', () => { muted = !muted; $('#muteBtn').textContent = muted ? '🔇' : '🔊'; });
function goMenu() { refreshBest(); startGame('demo'); $('#scoreNum').textContent = '0'; $('#info').innerHTML = ''; }
document.addEventListener('visibilitychange', () => { if (document.hidden && G && G.mode !== 'demo' && !G.over && !G.paused) togglePause(); });

/* =========================================================
   主迴圈
   ========================================================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G && !G.paused && !G.over) update(dt);
  else if (G && G.over) { // 結束後讓特效繼續播完
    for (const f of G.fx) { f.t += dt; if (f.k === 'p' || f.k === 'smoke' || f.k === 'fling') { f.x += f.vx * dt; f.y += f.vy * dt; } }
    for (const f of G.floaters) f.t += dt;
    G.fx = G.fx.filter(f => f.t < f.life); G.floaters = G.floaters.filter(f => f.t < f.life);
    G.shake = Math.max(0, G.shake - dt * 2.5); G.flash = Math.max(0, G.flash - dt * 1.4);
  }
  draw(); updateHud();
  requestAnimationFrame(loop);
}
goMenu();
requestAnimationFrame(loop);
</script>
